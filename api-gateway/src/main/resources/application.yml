server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user
          uri: lb://user
          predicates:
            - Path=/api/users/**
        - id: hotel
          uri: lb://hotel
          predicates:
            - Path=/api/hotels/**,/api/bookings/**,/api/bookingstatushistorys/**
        - id: minio
          uri: lb://minio
          predicates:
            - Path=/api/images/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka