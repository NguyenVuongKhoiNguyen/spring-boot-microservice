server:
  port: 8083

spring:
  application:
    name: booking
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
