server:
  port: 8082

spring:
  application:
    name: hotel
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/hotel
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    placeholders:
      mcp_password: ${MCP_READER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

app:
  cache:
    ttl:
      hotel-detail: 10m
      hotel-list: 2m
      hotelimage-detail: 10m
      hotelimage-list: 2m
      roomtype-detail: 10m
      roomtype-list: 2m
      room-detail: 10m
      room-list: 2m