name: minio-server

services:
  minio:
    image: elestio/minio:latest
    container_name: minio_server
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: alpine:latest
    container_name: minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache aws-cli;
      echo 'Waiting for MinIO...';
      sleep 5;
      aws configure set aws_access_key_id $${MINIO_ROOT_USER};
      aws configure set aws_secret_access_key $${MINIO_ROOT_PASSWORD};
      aws configure set default.region us-east-1;
      aws --endpoint-url http://minio:9000 s3 mb s3://$${MINIO_BUCKET_NAME} || true;
      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":[\"s3:GetObject\"],\"Effect\":\"Allow\",\"Principal\":\"*\",\"Resource\":[\"arn:aws:s3:::'$${MINIO_BUCKET_NAME}'/*\"]}]}' > policy.json;
      aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket $${MINIO_BUCKET_NAME} --policy file://policy.json;
      echo 'keep' > .keep;
      aws --endpoint-url http://minio:9000 s3api put-object --bucket $${MINIO_BUCKET_NAME} --key hotels/.keep --body .keep;
      aws --endpoint-url http://minio:9000 s3api put-object --bucket $${MINIO_BUCKET_NAME} --key users/.keep --body .keep;
      echo 'Buckets and folders created successfully.';
      exit 0;
      "

volumes:
  minio_data:
    name: minio_data
