server:
  port: 8085

spring:
  application:
    name: notification
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/notification
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    placeholders:
      mcp_password: ${MCP_READER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka