
name: payment-db

services:
  postgres:
    container_name: payment_db
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT}:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 128mb

  flyway-init:
    container_name: payment_flyway_init
    image: flyway/flyway:10
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: >-
      -connectRetries=10
      migrate
    environment:
      FLYWAY_PLACEHOLDERS_MCP_PASSWORD: ${MCP_READER_PASSWORD:?missing}
      FLYWAY_URL: jdbc:postgresql://payment_db:5432/${PAYMENT_DB_NAME}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

volumes:
  payment_data:
    name: payment_data