spring:
  application:
    name: payment
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:17:///payment
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      mcp_password: testpassword
  jpa:
    hibernate:
      ddl-auto: validate
eureka:
  client:
    enabled: false

sepay:
  account:
    number: "testaccount"
    name: "testname"
  bank:
    id: "testbank"
  webhook:
    api:
      key: "testkey"

payment:
  code:
    prefix: "BKG"
  qr:
    template: "compact2"
