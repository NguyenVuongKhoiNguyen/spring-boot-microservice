server:
  port: 8081

spring:
  application:
    name: user
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/user
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    placeholders:
      mcp_password: ${MCP_READER_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000
  cookie:
    access-name: access_token
    refresh-name: refresh_token
    secure: true
    same-site: Strict

cors:
  allowed-origins: http://localhost:3000